[project]
name = "zaofang-brand"
version = "1.0.0"
description = "Zaofang's logos, colour tokens and themes, generated from code."
requires-python = ">=3.13"
dependencies = ["shapely>=2.0"]

[project.optional-dependencies]
png = ["playwright>=1.40", "pillow>=10"]
print = ["fonttools>=4.50"]

[project.scripts]
zaofang-brand = "zaofang_brand.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zaofang_brand"]
